# Keeps nixpkgs (and with it Go, Caddy, Postgres, ...) current.
name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@v29
        id: update
        with:
          pr-title: "Update flake.lock"
      # PRs opened with GITHUB_TOKEN don't trigger CI; workflow_dispatch does.
      - if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref update_flake_lock_action
