{{define "content"}}
<div class="login">
  <img src="/static/logo.svg" alt="" width="56" height="56">
  <h1>coolix</h1>
  <p class="muted">Self-hosting, the NixOS way.</p>
  <form method="post" action="/login" class="card">
    <label>Password <input type="password" name="password" autofocus required autocomplete="current-password webauthn"></label>
    <button class="primary">Sign in</button>
  </form>
  {{if .Passkeys}}
  <div class="card passkey-login">
    <button data-passkey-login>Sign in with a passkey</button>
    <p class="muted small" data-passkey-status></p>
  </div>
  {{end}}
  <p class="loginfoot"><button class="link theme-toggle" type="button" data-theme-toggle title="Theme">Theme</button></p>
</div>
{{end}}
