{{define "appfields"}}
<label>Source <small>flake reference</small>
  <input name="source" value="{{.Source}}" placeholder="github:you/app" required spellcheck="false"></label>
<label>Domains <small>one per line, routed through Caddy with automatic HTTPS</small>
  <textarea name="domains" rows="2" spellcheck="false" placeholder="app.example.com">{{join .Domains "\n"}}</textarea></label>
<div class="row">
  <label>Package <small>default: <code>default</code></small><input name="package" value="{{.Package}}" spellcheck="false"></label>
  <label>Command <small>default: <code>mainProgram</code></small><input name="command" value="{{.Command}}" placeholder="bin/server" spellcheck="false"></label>
</div>
<div class="row">
  <label>Health check path <small>default: TCP check</small><input name="health_path" value="{{healthPath .}}" placeholder="/healthz" spellcheck="false"></label>
  <label>Health timeout <small>default: 30s</small><input name="health_timeout" value="{{healthTimeout .}}" placeholder="30s" spellcheck="false"></label>
</div>
<fieldset>
  <legend>Databases <small>private to this app, peer-authenticated over a unix socket</small></legend>
  <div class="check"><label class="check"><input type="checkbox" name="db_postgres" value="1" {{if hasDB . "postgres"}}checked{{end}}> PostgreSQL</label>
    <input class="tiny" name="pg_version" value="{{dbVersion .}}" placeholder="18" aria-label="PostgreSQL major version"> <small>sets <code>DATABASE_URL</code>; changing the major version needs a manual upgrade</small></div>
  <label class="check"><input type="checkbox" name="db_redis" value="1" {{if hasDB . "redis"}}checked{{end}}> Redis <small>sets <code>REDIS_URL</code></small></label>
</fieldset>
<label>Environment <small>KEY=VALUE per line; stored in git, so use secrets for anything sensitive</small>
  <textarea name="env" rows="4" spellcheck="false" placeholder="LOG_LEVEL=info">{{envLines .Env}}</textarea></label>
{{template "advancedfields" .}}
{{end}}
{{define "advancedfields"}}
<details class="advanced" {{if or .PreStart .Path .Resources .Backup .Webhook}}open{{end}}>
  <summary>Advanced</summary>
  <div class="row">
    <label>Pre-start command <small>runs before each start, e.g. migrations</small>
      <input name="pre_start" value="{{.PreStart}}" placeholder="bin/migrate" spellcheck="false"></label>
    <label>Runtime packages <small>nixpkgs attributes on <code>PATH</code></small>
      <input name="path" value="{{join .Path " "}}" placeholder="ffmpeg imagemagick" spellcheck="false"></label>
  </div>
  <div class="row three">
    <label>Pre-start timeout <small>default 15m</small><input name="pre_start_timeout" value="{{.PreStartTimeout}}" placeholder="15m" spellcheck="false"></label>
  </div>
  <div class="row three">
    <label>Memory limit<input name="memory_max" value="{{with .Resources}}{{.MemoryMax}}{{end}}" placeholder="512M" spellcheck="false"></label>
    <label>CPU limit<input name="cpu_quota" value="{{with .Resources}}{{.CPUQuota}}{{end}}" placeholder="100%" spellcheck="false"></label>
    <label>Task limit<input name="tasks_max" value="{{with .Resources}}{{if .TasksMax}}{{.TasksMax}}{{end}}{{end}}" placeholder="512" inputmode="numeric"></label>
  </div>
  <div class="row three">
    <label>Backup schedule <small>postgres only</small><input name="backup_schedule" value="{{with .Backup}}{{.Schedule}}{{end}}" placeholder="daily" spellcheck="false"></label>
    <label>Backups to keep<input name="backup_keep" value="{{with .Backup}}{{if .Keep}}{{.Keep}}{{end}}{{end}}" placeholder="7" inputmode="numeric"></label>
    <label>Webhook branch <small>default: any</small><input name="webhook_branch" value="{{with .Webhook}}{{.Branch}}{{end}}" placeholder="main" spellcheck="false"></label>
  </div>
</details>
{{end}}
